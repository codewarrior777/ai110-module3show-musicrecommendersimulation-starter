[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender"
version = "1.0.0"
description = "Music recommender simulation — AI 110 Module 3 project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gustavo Ramos", email = "codewarrior777@users.noreply.github.com" }
]
keywords = ["music", "recommender", "python", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "streamlit>=1.30",
    "tabulate>=0.9",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/codewarrior777/ai110-module3show-musicrecommendersimulation-starter"
Repository = "https://github.com/codewarrior777/ai110-module3show-musicrecommendersimulation-starter"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"